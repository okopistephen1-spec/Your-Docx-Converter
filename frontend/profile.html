<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile | Your-Docx-Converter</title>
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script src="./config.js" defer></script>
        <style>
            body { background: #f4f6ff; font-family: Arial, sans-serif; }
            .profile-shell { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
            .profile-card { background: white; border-radius: 22px; box-shadow: 0 18px 40px rgba(94, 74, 189, 0.12); padding: 28px; }
            .profile-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
            .profile-user { display: flex; align-items: center; gap: 18px; }
            .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #6d5efc, #8a84ff); display: grid; place-items: center; color: white; font-size: 1.8rem; font-weight: 700; overflow: hidden; }
            .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
            .profile-name { margin: 0; font-size: 2rem; }
            .profile-email { margin: 4px 0 0; color: #625f7a; }
            .button-row { display: flex; gap: 12px; flex-wrap: wrap; }
            .primary-btn, .secondary-btn { border: none; border-radius: 999px; padding: 12px 18px; cursor: pointer; font-weight: 600; }
            .primary-btn { background: #4338ca; color: white; }
            .secondary-btn { background: #eef2ff; color: #2f2d52; }
            .status-box { margin-top: 24px; background: #f7f8ff; border: 1px solid #e0e7ff; border-radius: 18px; padding: 18px; }
            .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; margin-top: 20px; }
            .meta-box { background: #f9fafc; border-radius: 14px; padding: 14px 16px; border: 1px solid #edf1ff; }
            .meta-label { color: #655f7d; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
            .meta-value { margin-top: 8px; font-size: 1.1rem; font-weight: 600; }
            .hidden { display: none; }
        </style>
    </head>
    <body>
        <div class="profile-shell">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-user">
                        <div class="avatar" id="userAvatar">Y</div>
                        <div>
                            <h1 class="profile-name" id="profileName">Your Profile</h1>
                            <p class="profile-email" id="profileEmail">Not signed in</p>
                        </div>
                    </div>

                    <div class="button-row">
                        <button class="primary-btn" id="signInButton" type="button">Sign in with Google</button>
                        <button class="secondary-btn hidden" id="logoutButton" type="button">Log out</button>
                    </div>
                </div>

                <div class="status-box" id="statusBox">
                    Authenticate with Google to save and manage your profile information.
                </div>

                <div class="meta">
                    <div class="meta-box">
                        <div class="meta-label">Account</div>
                        <div class="meta-value" id="accountType">Guest</div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-label">Documents</div>
                        <div class="meta-value" id="docCount">0</div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-label">Last sign-in</div>
                        <div class="meta-value" id="lastLogin">Not available</div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            window.APP_CONFIG = window.APP_CONFIG || {
                apiBaseUrl: "https://your-docx-converter.onrender.com",
                googleClientId: ""
            };

            const apiBaseUrl = (window.APP_CONFIG && window.APP_CONFIG.apiBaseUrl ? window.APP_CONFIG.apiBaseUrl.replace(/\/$/, '') : window.location.origin);
            const googleClientId = (window.APP_CONFIG && window.APP_CONFIG.googleClientId) || '';
            const authCookieName = 'docx_auth';
            const csrfCookieName = 'docx_csrf';

            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
                return match ? decodeURIComponent(match[1]) : '';
            }

            function setStatus(message, isError = false) {
                const box = document.getElementById('statusBox');
                box.textContent = message;
                box.style.borderColor = isError ? '#fecaca' : '#e0e7ff';
                box.style.background = isError ? '#fff1f2' : '#f7f8ff';
            }

            function setAvatarImage(src, fallbackText) {
                const avatarEl = document.getElementById('userAvatar');
                avatarEl.textContent = '';
                avatarEl.innerHTML = src ? `<img src="${src}" alt="Profile avatar" />` : fallbackText;
            }

            function updateUserUI(user) {
                if (!user) {
                    document.getElementById('profileName').textContent = 'Your Profile';
                    document.getElementById('profileEmail').textContent = 'Not signed in';
                    setAvatarImage('', 'Y');
                    document.getElementById('accountType').textContent = 'Guest';
                    document.getElementById('docCount').textContent = '0';
                    document.getElementById('lastLogin').textContent = 'Not available';
                    document.getElementById('logoutButton').classList.add('hidden');
                    document.getElementById('signInButton').classList.remove('hidden');
                    return;
                }

                const name = user.name || user.email || 'Google User';
                document.getElementById('profileName').textContent = name;
                document.getElementById('profileEmail').textContent = user.email || 'Google account';
                setAvatarImage(user.picture || '', (name || 'G').charAt(0).toUpperCase());
                document.getElementById('accountType').textContent = 'Google';
                document.getElementById('docCount').textContent = '1';
                document.getElementById('lastLogin').textContent = 'Just now';
                document.getElementById('logoutButton').classList.remove('hidden');
                document.getElementById('signInButton').classList.add('hidden');
            }

            async function fetchCurrentUser() {
                const authToken = getCookie(authCookieName);
                if (!authToken) {
                    updateUserUI(null);
                    setStatus('Sign in with Google to continue.');
                    return;
                }

                const csrf = getCookie(csrfCookieName);
                try {
                    const response = await fetch(`${apiBaseUrl}/api/auth/me`, {
                        method: 'GET',
                        headers: csrf ? { 'X-CSRF-Token': csrf } : {},
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        updateUserUI(null);
                        setStatus('Authentication required. Please sign in.', true);
                        return;
                    }

                    const payload = await response.json();
                    updateUserUI(payload.user || null);
                    setStatus(payload.user ? `Signed in as ${payload.user.email}` : 'Authentication required.');
                } catch (error) {
                    updateUserUI(null);
                    setStatus('Authentication check failed.', true);
                }
            }

            async function exchangeGoogleToken(credential) {
                const response = await fetch(`${apiBaseUrl}/api/auth/google`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id_token: credential })
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.error || 'Google sign-in failed.');
                }

                const csrf = getCookie(csrfCookieName);
                const meResponse = await fetch(`${apiBaseUrl}/api/auth/me`, {
                    method: 'GET',
                    headers: csrf ? { 'X-CSRF-Token': csrf } : {},
                    credentials: 'include'
                });

                const mePayload = await meResponse.json().catch(() => ({}));
                if (!meResponse.ok || !mePayload.user) {
                    throw new Error('Unable to load authenticated user profile.');
                }

                updateUserUI(mePayload.user);
                setStatus(`Welcome, ${mePayload.user.name || mePayload.user.email}.`);
                window.location.assign('/profile');
            }

            async function logout() {
                const authToken = getCookie(authCookieName);
                const csrf = getCookie(csrfCookieName);
                if (!authToken) {
                    updateUserUI(null);
                    return;
                }

                try {
                    const response = await fetch(`${apiBaseUrl}/api/auth/logout`, {
                        method: 'POST',
                        headers: csrf ? { 'X-CSRF-Token': csrf } : {},
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        const payload = await response.json().catch(() => ({}));
                        setStatus(payload.error || 'Logout failed.', true);
                        return;
                    }

                    updateUserUI(null);
                    setStatus('You have been signed out.');
                    window.location.assign('/profile');
                } catch (error) {
                    setStatus('Logout failed.', true);
                }
            }

            function initializeGoogleSignIn() {
                if (!googleClientId) {
                    setStatus('Google Sign-In is not configured. Set window.APP_CONFIG.googleClientId before enabling auth.', true);
                    return;
                }

                if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                    setStatus('Google Identity Services is unavailable.', true);
                    return;
                }

                window.google.accounts.id.initialize({
                    client_id: googleClientId,
                    callback: (response) => {
                        if (!response || !response.credential) {
                            setStatus('Google sign-in was cancelled.', true);
                            return;
                        }
                        exchangeGoogleToken(response.credential).catch((error) => {
                            setStatus(error.message || 'Google sign-in failed.', true);
                        });
                    }
                });

                document.getElementById('signInButton').addEventListener('click', () => {
                    window.google.accounts.id.prompt();
                });
            }

            document.getElementById('logoutButton').addEventListener('click', logout);

            if (window.google && window.google.accounts && window.google.accounts.id) {
                initializeGoogleSignIn();
            } else {
                const waitForGoogle = setInterval(() => {
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        clearInterval(waitForGoogle);
                        initializeGoogleSignIn();
                    }
                }, 200);
            }

            fetchCurrentUser();
        </script>
    </body>
</html>
