<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <title>Document Converter | Your-Docx-Converter</title>
    </head>
    <body class="converter-page">

        <header class="topbar">

            <a href="/" class="brand">Your Docx</a>

            <div class="topbar-actions">

                <button type="button" aria-label="Notifications">
                    <i class="bi bi-bell"></i>
                </button>

                <a href="/profile" class="profile-icon" aria-label="Profile">
                    <i class="bi bi-person"></i>
                </a>

            </div>

        </header>

        <main>

            <section>
                <h2>PDF to Images</h2>
                <p>Convert PDF pages into PNG of JPG images</p>
                
                <form action="/convert/pdf-to-images" method="POST" enctype="multipart/form-data">
                    <input type="file" name="pdf_file" accept=".pdf,application/pdf" required>
                    <button type="submit">Convert to Images</button>
                </form>
            </section>

            <section>
                <h2>PDF to Word</h2>
                <p>Conver a PDF document into an editable word document.</p>

                <form action="/convert/pdf-to-word" method="POST" enctype="multipart/form-data">
                    <input type="file" name="pdf_file" accept=".pdf,application/pdf" required>
                    <button type="submit">Convert to Word</button>
                </form>

            </section>

            <section>
                <h2>Word to PDF</h2>
                <p>Conver a PDF document into an editable word document.</p>

                <form action="/convert/word-to-pdf" method="POST" enctype="multipart/form-data">
                    <input type="file" name="word_file" accept=".docx,.doc" required>
                    <button type="submit">Convert to PDF</button>
                </form>

            </section>

            <a href="/">Back To Home⤆</a>
        </main>
    </body>
</html>
