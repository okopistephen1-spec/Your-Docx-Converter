<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <title>Your-Docx-Converter</title>
    </head>
    <body>
        <section class="hero">
            <br><br>
     
            <div class="hero-image">
                <img
                    src="{{ url_for('static', filename='images/doc-convert.png') }}"
                    alt="Document conversion illustration"
>
            </div>


            <header>
                <div class="hero-label">
                    <span class="status-dot"></span>
                    Universal document engine
                </div>
                <h1>Your Docx <br>
                    <span class="converter-title">Converter</span>
                </h1>
                <p>Convert, edit, and manage your documents in one place.</p>
            </header>
        </section>

        <main>
            <section class="little-header">
                <p>Document Converter</p>
                <p>You can convert your document to different formats.</p>
                <a href="/converter" class="convert-btn">🖋Get Started</a>
            </section>
        </main>
        <br><br>
        <br><br>
        <br><br>
        <br><br>

        <footer class="footer">
            <nav class="navbar">
                <div class="nav-links">

                    <a href="/" class="nav-item active">
                        <i class="bi bi-house-door"></i>
                        <span>Home</span>
                    </a>

                    <a href="/converter" class="nav-item">
                        <i class="bi bi-arrow-left-right"></i>
                        <span>Convert</span>
                    </a>

                    <a href="/editor" class="nav-item">
                        <i class="bi bi-pencil-square"></i>
                        <span>Editor</span>
                    </a>

                    <a href="/profile" class="nav-item">
                        <i class="bi bi-person-circle"></i>
                        <span>Profile</span>
                    </a>

                </div>
            </nav>
        </footer>

    </body>
</html>
